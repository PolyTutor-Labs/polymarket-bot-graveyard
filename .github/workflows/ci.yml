name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Archive quality CI: docs lint, internal links, compileall, secret scan, quality-infra tests.
# No deploy. contents remains read.
permissions:
  contents: read

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lychee (offline — verifies internal links only)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress ."
          fail: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan working tree for secrets
        run: python scripts/security/check_secrets.py

  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q -x '(.venv|venv|__pycache__|\.git)' .
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.4
      - name: Quality-infra tests
        run: python -m pytest
