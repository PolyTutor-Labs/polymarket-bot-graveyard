[pytest]
# Quality-infrastructure tests only.
# Historical bot snapshots under bots/ must never be collected as tests.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    .pytest_cache
    node_modules
    bots
    docs
    assets
    data
    scripts
